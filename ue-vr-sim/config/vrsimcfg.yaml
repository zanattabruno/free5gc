info:
  version: 1.0.0
  description: VR UE Simulator configuration

configuration:
  api:
    bindAddr: 0.0.0.0:9090
  dashboard:
    bindAddr: 0.0.0.0:3000
    staticDir: ./dashboard
  nwdaf:
    uri: http://127.0.0.15:8000
    pushIntervalMs: 500
  nef:
    uri: http://127.0.0.5:8000
  defaultSessions:
    count: 3
    profile: INTERACTIVE_VR
  simulation:
    frameRate: 90
    tickIntervalMs: 100
